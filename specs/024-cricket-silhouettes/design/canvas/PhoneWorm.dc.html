<script type="text/x-dc" data-dc-script data-props='{"fit":{"editor":"enum","options":["height","width","focus"],"default":"width","section":"Silhouette"},"focus":{"editor":"range","min":0.1,"max":0.7,"step":0.01,"default":0.36,"section":"Silhouette"},"silOpacity":{"editor":"range","min":0.02,"max":0.25,"step":0.01,"default":0.07,"section":"Silhouette"},"$preview":{"width":390,"height":740}}'>
class Component extends DCLogic {
measure() {
  if (!this.card) return;
  const h = this.card.offsetHeight, w = this.card.offsetWidth;
  const s = this.state || {};
  if (Math.abs((s.cardH || 0) - h) > 1 || s.cardW !== w) this.setState({ cardH: h, cardW: w });
}
componentDidMount() { this.measure(); setTimeout(() => this.measure(), 500); }
componentDidUpdate() { this.measure(); }
renderVals() {
  if (!this._setCard) this._setCard = (el) => { this.card = el; };
  const s = this.state || {};
  const W = s.cardW || 330, H = s.cardH || 600;
  const fit = this.props.fit ?? 'width';
  const focus = this.props.focus ?? 0.36;
  const ratio = 838 / 870;
  let w, h, left;
  if (fit === 'width') { w = W; h = W / ratio; left = 0; }
  else { h = H * 0.95; w = h * ratio; left = fit === 'focus' ? W / 2 - focus * w : (W - w) / 2; }
  return {
    setCard: this._setCard,
    silOpacity: this.props.silOpacity ?? 0.07,
    silLeft: Math.round(left), silTop: Math.round((H - h) / 2), silW: Math.round(w), silH: Math.round(h)
  };
}
}
</script>
