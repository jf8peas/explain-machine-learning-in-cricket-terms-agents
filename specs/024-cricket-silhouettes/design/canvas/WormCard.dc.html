<x-dc>
<helmet>

body{margin:0;background:#ffffff}
a{color:#1d6fe0}a:hover{color:#1557b0}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 1440px; height: 881px; background: #ffffff">
<img src="/_blob/b5228bbc17fcac99ba02fb68ed8f454a" alt="" aria-hidden="true" style="position: absolute; left: {{silLeft}}px; top: 78px; width: 732px; height: 760px; opacity: {{silOpacity}}; transform: scaleX({{flipX}}); pointer-events: none; z-index: 0">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"silOpacity":{"editor":"range","min":0.02,"max":0.25,"step":0.01,"default":0.07,"section":"Silhouette"},"facing":{"editor":"enum","options":["right","left"],"default":"right","section":"Silhouette"},"silLeft":{"editor":"range","min":100,"max":700,"step":10,"default":358,"unit":"px","section":"Silhouette"},"$preview":{"width":1440,"height":881}}'>
class Component extends DCLogic {
renderVals() {
const facing = this.props.facing ?? 'right';
return {
silOpacity: this.props.silOpacity ?? 0.07,
silLeft: this.props.silLeft ?? 358,
flipX: facing === 'left' ? -1 : 1
};
}
}
</script>
