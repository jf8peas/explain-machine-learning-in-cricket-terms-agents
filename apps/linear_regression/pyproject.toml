[project]
name = "linear-regression-app"
version = "0.1.0"
description = "Linear regression agent app: predict a T20 first-innings total from the score at 10 overs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.110",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",      # language-model and rate-limit-store calls (no SDKs)
    "pydantic>=2",      # validates the language model's reply
]

[dependency-groups]
dev = [
    "pytest>=8",
    "requests>=2.31",
    "uvicorn>=0.30",
    "jsonschema>=4",
    "scikit-learn>=1.5",  # test only: checks our numpy fit against LinearRegression
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "scripts", "."]
testpaths = ["tests"]
